<!DOCTYPE html>
<html>

<head>
  <title>Login - Emotrack</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      background: #0a0a0f;
      font-family: Poppins;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      padding: 40px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(45deg, #7c6cff, #5de0ff);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    a {
      color: #7c6cff;
      text-decoration: none;
    }
  </style>

</head>

<body>

  <div class="card">

    <h2><button onclick="login()">Login</button></h2>

    <input type="email" placeholder="Email">

    <input type="password" placeholder="Password">

    <button onclick="location.href='dashboard.html'">Login</button>

    <p>Don't have account? <a href="register.html">Register</a></p>

  </div>
  <script>

    async function login() {

      let email = document.querySelector("input[type=email]").value;
      let password = document.querySelector("input[type=password]").value;

      let response = await fetch("http://localhost:7070/login", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          email: email,
          password: password
        })

      });

      let result = await response.text();

      if (result === "LOGIN_SUCCESS") {
        alert("Login successful");
        window.location.href = "dashboard.html";
      } else {
        alert("Invalid email or password");
      }

    }

  </script>
</body>

</html>
